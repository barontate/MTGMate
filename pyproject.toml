[project]
name = "MTGMate-checker"
version = "1.0.0"
description = "Looks at cards that MTGMate wants to buy from your collection"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Tate", email = "stuggitg4@gmail.com" },
]
dependencies = [
    "textual>=8.2",          # the terminal UI
    "requests>=2.32",        # mtgmate + Scryfall HTTP
    "beautifulsoup4>=4.12",  # reads the CSRF token / cart count from pages
    "playwright>=1.45",      # only for the one-off browser login (helpers/auth.py)
]

[project.scripts]
mtgmate-checker = "mtgmate_checker.cli:main"

[dependency-groups]
dev = [
    "pre-commit",
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "types-requests",        # type stubs, needed for mypy --strict
    "pyinstaller>=6.22.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mtgmate_checker"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "SIM",     # simplify
    "RUF",     # ruff-specific
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
